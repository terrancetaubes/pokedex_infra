name: identity

# IAM changes only. Manual run. Choose the target environment.
# Both jobs use the identity environment, which requires a reviewer.
# Requires the identity GitHub environment to hold AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_IDENTITY_CLIENT_ID, and AZURE_RESOURCE_GROUP (for the target, see docs/BOOTSTRAP.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to grant access in"
        required: true
        type: choice
        options:
          - dev
          - itg

permissions:
  contents: read

concurrency:
  group: identity-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  whatif:
    name: Identity what-if (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: identity
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "rg-pokedex-${{ inputs.environment }}" \
            --parameters identity/${{ inputs.environment }}.bicepparam

  deploy:
    name: Identity deploy (${{ inputs.environment }})
    needs: whatif
    runs-on: ubuntu-latest
    environment: identity
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy identities
        run: |
          az deployment group create \
            --name "identity-${{ inputs.environment }}-${{ github.run_number }}" \
            --resource-group "rg-pokedex-${{ inputs.environment }}" \
            --parameters identity/${{ inputs.environment }}.bicepparam
